<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Multi API TodoList</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="container">
    <h1>Multi API TodoList</h1>
    <p id="message" role="status"></p>

    <section id="auth">
        <div class="card">
            <h2>Login</h2>
            <form id="loginForm">
                <input id="loginEmail" type="email" placeholder="Email" aria-label="Email de login" required>
                <input id="loginPassword" type="password" placeholder="Senha" aria-label="Senha de login" required>
                <button type="submit">Entrar</button>
            </form>
        </div>
        <div class="card">
            <h2>Cadastro</h2>
            <form id="registerForm">
                <input id="name" placeholder="Nome" aria-label="Nome" minlength="3" maxlength="100" required>
                <input id="email" type="email" placeholder="Email" aria-label="Email de cadastro" required>
                <input id="password" type="password" placeholder="Senha (mínimo 6 caracteres)" aria-label="Senha de cadastro" minlength="6" required>
                <button type="submit">Cadastrar</button>
            </form>
        </div>
    </section>

    <section id="tasks" hidden>
        <p><span id="userName"></span> <button id="logout" type="button">Sair</button></p>
        <div class="card">
            <h2>Nova Tarefa</h2>
            <form id="todoForm">
                <input type="text" id="title" placeholder="Título" aria-label="Título" maxlength="200" required>
                <textarea id="description" placeholder="Descrição" aria-label="Descrição" maxlength="2000"></textarea>
                <button type="submit">Adicionar</button>
            </form>
        </div>
        <div class="card">
            <h2>Lista de Tarefas</h2>
            <ul id="todoList"></ul>
        </div>
        <div class="card">
            <h2>Estatísticas</h2>
            <p>Total: <span id="total">0</span></p>
            <p>Concluídas: <span id="completed">0</span></p>
            <p>Pendentes: <span id="pending">0</span></p>
        </div>
    </section>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
